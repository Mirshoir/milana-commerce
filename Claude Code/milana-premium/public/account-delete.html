<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Delete Account | Milana Premium</title>
  <meta name="description" content="Request deletion of a Milana Premium customer account.">
  <style>
    :root{color-scheme:dark;--bg:#090c0d;--panel:#141819;--line:#303536;--text:#f7f4ef;--muted:#aeb0af;--danger:#b34a40}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(560px,calc(100% - 32px));margin:auto;padding:48px 0}.brand{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
    h1{font:500 clamp(34px,8vw,52px)/1.05 Georgia,serif;margin:18px 0 14px}p{color:var(--muted)}.card{margin-top:28px;padding:24px;background:var(--panel);border:1px solid var(--line)}
    label{display:block;margin:18px 0 7px;font-size:13px;font-weight:650}input{width:100%;height:50px;border:1px solid var(--line);background:#090c0d;color:var(--text);padding:0 14px;font:inherit;border-radius:4px}
    .code{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.code button{min-width:120px}
    button{height:50px;border:1px solid var(--line);background:#222728;color:var(--text);padding:0 18px;font:inherit;font-weight:650;border-radius:4px;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}.delete{width:100%;margin-top:22px;background:var(--danger);border-color:var(--danger)}
    .message{min-height:24px;margin:16px 0 0;color:#f2b4ae}.message.good{color:#9fd5ae}.legal{font-size:13px}.legal a{color:var(--text)}
    @media(max-width:480px){.code{grid-template-columns:1fr}.code button{width:100%}}
  </style>
</head>
<body>
  <main>
    <div class="brand">Milana Premium</div>
    <h1>Delete your account</h1>
    <p>This permanently removes your customer account, sign-in sessions, saved items, reviews, coupons, and support/chat identity. Required transaction records are retained only in anonymized form.</p>
    <div class="card">
      <form id="delete-account-form" novalidate>
        <label for="delete-email">Account email</label>
        <div class="code">
          <input id="delete-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          <button id="send-delete-code" type="button">Send code</button>
        </div>
        <label for="delete-code">Six-digit email code</label>
        <input id="delete-code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" required>
        <label for="delete-confirmation">Type DELETE to confirm</label>
        <input id="delete-confirmation" name="confirmation" autocomplete="off" placeholder="DELETE" required>
        <button class="delete" type="submit">Permanently delete account</button>
        <p class="message" id="delete-message" role="status" aria-live="polite"></p>
      </form>
    </div>
    <p class="legal">Read our <a href="/privacy">Privacy Policy</a> or <a href="/support">contact support</a> before continuing.</p>
  </main>
  <script src="/account-delete.js" defer></script>
</body>
</html>
